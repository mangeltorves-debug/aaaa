<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Task - Crear Cuenta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F5F2EB; /* Color de fondo general crema antiguo */
            font-family: 'Inter', serif, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .register-container {
            background-color: #EFECE1; /* Cuadro beige cálido */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            border: 1px solid #E2DCCF;
        }
        h2 {
            color: #3E322C; /* Marrón espresso vintage */
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            color: #5C4C43;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #FFFFFF; /* Cuadros de texto blancos */
            border: 1px solid #D9D2C5;
            border-radius: 8px;
            font-size: 14px;
            color: #3E322C;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #8C7A6B;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #5C4C43; /* Botón marrón elegante */
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #3E322C;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Reloj Task</h2>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>
    </div>

</body>
</html>
